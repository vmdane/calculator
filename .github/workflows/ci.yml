name: CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: flake8
        run: |
          # Erreurs bloquantes : syntaxe, imports non définis, noms non définis
          # E9   → erreurs d'exécution (ex: SyntaxError)
          # F63x → mauvaise utilisation de assert ou print en Python 2 style
          # F7   → erreurs de syntaxe détectées par pyflakes
          # F82  → variables non définies (undefined name)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Vérification qualité globale (non bloquante)
          flake8 . --count --exit-zero --statistics

      - name: pytest
        run: |
          pytest tests/

  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: trivy FS mode
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          format: sarif
          output: results.sarif
          severity: CRITICAL,HIGH

      - name: upload
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
